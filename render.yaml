services:
  - type: web
    name: radius-ai-backend
    runtime: node
    rootDir: backend          # деплоится только backend; frontend живёт на Vercel
    plan: starter             # Free засыпает через 15 мин без HTTP-трафика
    buildCommand: npm ci && npm run build
    startCommand: npm start   # слушает process.env.PORT
    healthCheckPath: /api/health
    autoDeploy: true
    numInstances: 1           # ВАЖНО: ровно один инстанс (один MTProto-клиент на сессию)
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: TELEGRAM_LEADS_BOT_TOKEN
        sync: false
      - key: TELEGRAM_LEADS_CHAT_ID   # группа менеджеров, например -1002140635125
        sync: false
      - key: TELEGRAM_OWNER_CHAT_ID   # необязательно: владелец в личку (дубль и запасной путь)
        sync: false
      - key: FRONTEND_URL      # https://dexa.uz — ссылки из Telegram, OAuth-редиректы, CORS
        sync: false
      - key: DEXA_BOT_TOKEN    # бот DexaAI (@BotFather): регистрация и вход в один клик, рассылки
        sync: false
      - key: DEXA_ADMIN_CHAT_IDS   # твой Telegram ID (через запятую): уведомления о регистрациях и заявках
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_WEBHOOK_VERIFY_TOKEN
        sync: false
